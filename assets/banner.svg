<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Node Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #a855f7; letter-spacing: 2px; }
    .node-text { font-family: monospace; font-size: 11px; fill: #38bdf8; font-weight: bold; }
    
    /* Subtle background animations */
    @keyframes pulsePath {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .flow-line {
      stroke: url(#accentGrad1);
      stroke-width: 2.5;
      stroke-dasharray: 8 8;
      animation: pulsePath 25s linear infinite;
    }
    
    .floating-card {
      animation: floatNode 6s ease-in-out infinite;
    }
    .floating-card-alt {
      animation: floatNode 8s ease-in-out infinite 1s;
    }
    .bg-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="150" cy="100" r="120" fill="#6366f1" opacity="0.15" class="bg-glow" filter="blur(40px)"/>
  <circle cx="1050" cy="250" r="140" fill="#a855f7" opacity="0.15" class="bg-glow" filter="blur(40px)"/>
  <circle cx="900" cy="80" r="100" fill="#06b6d4" opacity="0.12" class="bg-glow" filter="blur(40px)"/>

  <!-- Background Animated Data Flows (Strictly behind text & side elements) -->
  <path d="M 800 280 Q 900 200 1020 250 T 1150 140" fill="none" class="flow-line" opacity="0.6"/>
  <path d="M 50 290 Q 200 320 350 270 T 550 310" fill="none" class="flow-line" opacity="0.4"/>

  <!-- Right Side Visual Elements: EDI Data Transformation Diagram -->
  <g transform="translate(750, 45)">
    <!-- Node 1: X12 Input -->
    <g class="floating-card">
      <rect x="0" y="40" width="110" height="54" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <text x="55" y="64" text-anchor="middle" class="node-text" fill="#38bdf8">X12 / EDIFACT</text>
      <text x="55" y="80" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">ISA*00*...~850</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 110 67 L 150 67" stroke="url(#accentGrad1)" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="150,67 142,62 142,72" fill="#a855f7"/>

    <!-- Node 2: EDI Engine / Translator Hub -->
    <g class="floating-card-alt">
      <rect x="150" y="20" width="130" height="94" rx="14" fill="#0f172a" stroke="url(#accentGrad1)" stroke-width="2" filter="url(#glow)"/>
      <rect x="151" y="21" width="128" height="92" rx="13" fill="#1e1b4b" opacity="0.8"/>
      <text x="215" y="52" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="14" fill="#ffffff">EDI Engine 🔄</text>
      <text x="215" y="72" text-anchor="middle" font-family="system-ui" font-size="10" fill="#a855f7">Validation &amp; Map</text>
      <text x="215" y="90" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">AS2 / SFTP / API</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 280 67 L 320 67" stroke="url(#accentGrad2)" stroke-width="2"/>
    <polygon points="320,67 312,62 312,72" fill="#06b6d4"/>

    <!-- Node 3: JSON/ERP Output -->
    <g class="floating-card">
      <rect x="320" y="40" width="110" height="54" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.9"/>
      <text x="375" y="64" text-anchor="middle" class="node-text" fill="#34d399">JSON / ERP</text>
      <text x="375" y="80" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">{"order_id": 850}</text>
    </g>

    <!-- Feature Pills Below Diagram -->
    <g transform="translate(10, 160)">
      <rect x="0" y="0" width="125" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="62" y="18" text-anchor="middle" font-family="system-ui" font-size="11" fill="#cbd5e1">⚡ Real-time API</text>

      <rect x="135" y="0" width="145" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="207" y="18" text-anchor="middle" font-family="system-ui" font-size="11" fill="#cbd5e1">🔒 AS2 / SFTP Secure</text>

      <rect x="290" y="0" width="135" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="357" y="18" text-anchor="middle" font-family="system-ui" font-size="11" fill="#cbd5e1">🌐 Open-Source &amp; SaaS</text>
    </g>
  </g>

  <!-- Left Side: Main Title & Subtitle (Foreground Crisp Text) -->
  <g transform="translate(60, 90)">
    <!-- Tagline Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="url(#accentGrad1)" fill-opacity="0.2" stroke="url(#accentGrad1)" stroke-width="1"/>
    <text x="110" y="17" text-anchor="middle" class="tag">ENTERPRISE B2B INTEGRATION</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title">Awesome EDI Platform 📄 🔄</text>

    <!-- Subtitle -->
    <text x="0" y="118" class="subtitle">Curated Directory of B2B Integration, X12/EDIFACT Translators &amp; Cloud SaaS</text>
    
    <!-- Secondary Subtitle Bullet Points -->
    <g transform="translate(0, 155)">
      <circle cx="6" cy="-5" r="4" fill="#a855f7"/>
      <text x="20" y="0" font-family="system-ui" font-size="14" fill="#94a3b8">Commercial EDI SaaS • Open-Source Translators • AS2/SFTP Transport</text>
      
      <circle cx="6" cy="22" r="4" fill="#38bdf8"/>
      <text x="20" y="27" font-family="system-ui" font-size="14" fill="#94a3b8">Verified Pricing • Free Tier Limits • Valuation Rankings &amp; Market Sizing</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Bar -->
  <rect x="0" y="344" width="1200" height="6" fill="url(#accentGrad1)" rx="3"/>
</svg>
